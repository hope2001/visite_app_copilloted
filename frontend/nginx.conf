server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    # Defined once at server level. Locations below must not use add_header,
    # otherwise nginx drops these inherited headers.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Same-origin API: no CORS needed in production.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (never append): a client-supplied X-Forwarded-For must not reach the
        # backend, which uses the client address for login throttling.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Content-hashed build assets.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback: client-side routes resolve to index.html, which is always revalidated.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
